[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-antivirus"
version = "1.0.0"
description = "A module for antivirus"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "oarepo[rdm,tests]>=14.0.0dev0,<15.0.0",
    "oarepo-runtime>=7.0.0,<8.0.0",
]

[project.entry-points."invenio_base.api_apps"]
oarepoantivirus = "oarepo_antivirus.ext:OARepoAntivirus"

[project.entry-points."invenio_base.apps"]
oarepo_antivirus = "oarepo_antivirus.ext:OARepoAntivirus"

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_antivirus",
]
