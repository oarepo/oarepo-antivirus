[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-antivirus"
version = "1.0.0"
description = "A module for antivirus"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "oarepo[rdm,tests]>=14.0.0dev0,<15.0.0",
    "clamd==1.0.2"
]

[project.entry-points."invenio_base.api_apps"]
oarepoantivirus = "oarepo_antivirus.ext:OARepoAntivirus"

[project.entry-points."invenio_base.apps"]
oarepo_antivirus = "oarepo_antivirus.ext:OARepoAntivirus"

[project.entry-points."oarepo.file_processors"]
oarepo_antivirus_processor = "oarepo_antivirus.services.files.processors.antivirus:AntivirusFileProcessor"

[project.entry-points."flask.commands"]
antivirus = "oarepo_antivirus.cli:antivirus_cli"

[project.entry-points."invenio_celery.tasks"]
oarepo_antivirus = "oarepo_antivirus.tasks"

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_antivirus",
]